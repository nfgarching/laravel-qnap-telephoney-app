# Anrufanzeige (nfgarching/telephony) unter https://telephony.froehler-kollegen.de
# TLS und Zertifikat: Traefik (../../docker-compose.yml, Netz "traefik").
# Laravel-App in src/, Datenbank SQLite (src/database/database.sqlite).

x-app: &app
  image: telephony-app:latest
  restart: unless-stopped
  user: www-data
  volumes:
    - ./src:/var/www/html
  depends_on:
    - redis
  networks:
    - default
  labels:
    - "com.centurylinklabs.watchtower.enable=false"
  logging:
    options:
      max-size: 10m

services:
  app:
    <<: *app
    build:
      context: ./docker/php
      args:
        WWWUSER: ${HOST_UID:-1000}
        WWWGROUP: ${HOST_GID:-100}
    container_name: telephony_app
    # PHP-FPM startet als root und wechselt selbst auf www-data
    user: root

  web:
    image: nginx:alpine
    container_name: telephony_web
    restart: unless-stopped
    volumes:
      - ./src/public:/var/www/html/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
      - reverb
    networks:
      - default
      - traefik
    logging:
      options:
        max-size: 10m
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      - "traefik.http.routers.froehler-telephony.entrypoints=websecure"
      - "traefik.http.routers.froehler-telephony.rule=Host(`telephony.froehler-kollegen.de`)"
      - "traefik.http.routers.froehler-telephony.tls=true"
      - "traefik.http.routers.froehler-telephony.tls.certresolver=myresolver"
      - "traefik.http.routers.froehler-telephony.middlewares=froehler-telephony-headers"
      - "traefik.http.services.froehler-telephony.loadbalancer.server.port=8080"
      - "traefik.http.middlewares.froehler-telephony-headers.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.froehler-telephony-headers.headers.stsIncludeSubdomains=false"
      - "traefik.http.middlewares.froehler-telephony-headers.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.froehler-telephony-headers.headers.frameDeny=true"
      - "traefik.http.middlewares.froehler-telephony-headers.headers.referrerPolicy=same-origin"
      - "traefik.http.middlewares.froehler-telephony-headers.headers.permissionsPolicy=camera=(), microphone=(), geolocation=()"
      - "traefik.http.middlewares.froehler-telephony-headers.headers.customResponseHeaders.X-Robots-Tag=noindex, nofollow"
      - "traefik.http.middlewares.froehler-telephony-headers.headers.customResponseHeaders.Server="

  reverb:
    <<: *app
    container_name: telephony_reverb
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8081"]

  queue:
    <<: *app
    container_name: telephony_queue
    # Eigene Queue für Push, damit Anrufe nicht hinter anderen Jobs warten
    command: ["php", "artisan", "queue:work", "--queue=telephony,default", "--tries=3", "--max-time=3600"]

  scheduler:
    <<: *app
    container_name: telephony_scheduler
    command: ["php", "artisan", "schedule:work"]

  redis:
    image: redis:7-alpine
    container_name: telephony_redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks:
      - default
    logging:
      options:
        max-size: 10m

networks:
  default:
  traefik:
    external: true
