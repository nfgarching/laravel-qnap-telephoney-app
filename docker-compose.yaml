# Anrufanzeige für Sipgate-Telephony (nfgarching/telephony) hinter Traefik.
# Domain und Traefik-Einstellungen: .env (Vorlage .env.example).
# Laravel-App in src/ (eigene src/.env), Datenbank SQLite (src/database/database.sqlite).

x-app: &app
  image: ${APP_IMAGE:-telephony-app}:latest
  restart: unless-stopped
  user: www-data
  volumes:
    - ./src:/var/www/html
  depends_on:
    - redis
  networks:
    - default
  labels:
    - "com.centurylinklabs.watchtower.enable=false"
  logging:
    options:
      max-size: 10m

services:
  app:
    <<: *app
    build:
      context: ./docker/php
      args:
        WWWUSER: ${HOST_UID:-1000}
        WWWGROUP: ${HOST_GID:-100}
    container_name: ${CONTAINER_PREFIX:-telephony}_app
    # PHP-FPM startet als root und wechselt selbst auf www-data
    user: root

  web:
    image: nginx:alpine
    container_name: ${CONTAINER_PREFIX:-telephony}_web
    restart: unless-stopped
    volumes:
      - ./src/public:/var/www/html/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
      - reverb
    networks:
      - default
      - traefik
    logging:
      options:
        max-size: 10m
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK:-traefik}"
      - "traefik.http.routers.${TRAEFIK_ROUTER:-telephony}.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.${TRAEFIK_ROUTER:-telephony}.rule=Host(`${APP_DOMAIN:?APP_DOMAIN in .env setzen}`)"
      - "traefik.http.routers.${TRAEFIK_ROUTER:-telephony}.tls=true"
      - "traefik.http.routers.${TRAEFIK_ROUTER:-telephony}.tls.certresolver=${TRAEFIK_CERTRESOLVER:-myresolver}"
      - "traefik.http.routers.${TRAEFIK_ROUTER:-telephony}.middlewares=${TRAEFIK_ROUTER:-telephony}-headers"
      - "traefik.http.services.${TRAEFIK_ROUTER:-telephony}.loadbalancer.server.port=8080"
      - "traefik.http.middlewares.${TRAEFIK_ROUTER:-telephony}-headers.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.${TRAEFIK_ROUTER:-telephony}-headers.headers.stsIncludeSubdomains=false"
      - "traefik.http.middlewares.${TRAEFIK_ROUTER:-telephony}-headers.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.${TRAEFIK_ROUTER:-telephony}-headers.headers.frameDeny=true"
      - "traefik.http.middlewares.${TRAEFIK_ROUTER:-telephony}-headers.headers.referrerPolicy=same-origin"
      - "traefik.http.middlewares.${TRAEFIK_ROUTER:-telephony}-headers.headers.permissionsPolicy=camera=(), microphone=(), geolocation=()"
      - "traefik.http.middlewares.${TRAEFIK_ROUTER:-telephony}-headers.headers.customResponseHeaders.X-Robots-Tag=noindex, nofollow"
      - "traefik.http.middlewares.${TRAEFIK_ROUTER:-telephony}-headers.headers.customResponseHeaders.Server="

  reverb:
    <<: *app
    container_name: ${CONTAINER_PREFIX:-telephony}_reverb
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8081"]

  queue:
    <<: *app
    container_name: ${CONTAINER_PREFIX:-telephony}_queue
    # Eigene Queue für Push, damit Anrufe nicht hinter anderen Jobs warten
    command: ["php", "artisan", "queue:work", "--queue=telephony,default", "--tries=3", "--max-time=3600"]

  scheduler:
    <<: *app
    container_name: ${CONTAINER_PREFIX:-telephony}_scheduler
    command: ["php", "artisan", "schedule:work"]

  redis:
    image: redis:7-alpine
    container_name: ${CONTAINER_PREFIX:-telephony}_redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks:
      - default
    logging:
      options:
        max-size: 10m

networks:
  default:
  traefik:
    name: ${TRAEFIK_NETWORK:-traefik}
    external: true
