# Hinter Traefik (TLS endet dort). nginx liefert public/ aus, PHP geht an app:9000,
# WebSockets unter /app an Reverb.
server {
    listen 8080 default_server;
    server_name _;
    root /var/www/html/public;
    index index.php;

    server_tokens off;
    client_max_body_size 8M;

    # Echte Client-IP aus Traefik übernehmen (Docker-Netze)
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Reverb (WebSockets): wss://<APP_DOMAIN>/app/...
    location /app {
        proxy_pass http://reverb:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 120s;
    }

    location = /index.php {
        fastcgi_pass app:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        # REMOTE_ADDR ist dank real_ip bereits die echte Client-IP. TLS endet
        # immer bei Traefik → HTTPS fest setzen; Forwarded-Header nicht an PHP
        # weiterreichen, damit Laravel ihnen nie vertraut (kein Spoofing).
        fastcgi_param HTTPS on;
        fastcgi_param SERVER_PORT 443;
        fastcgi_param HTTP_X_FORWARDED_FOR "";
        fastcgi_param HTTP_X_FORWARDED_HOST "";
        fastcgi_param HTTP_X_FORWARDED_PORT "";
        fastcgi_param HTTP_X_FORWARDED_PROTO "";
        fastcgi_param HTTP_X_FORWARDED_PREFIX "";
        fastcgi_param HTTP_X_REAL_IP "";
        fastcgi_param HTTP_FORWARDED "";
        fastcgi_hide_header X-Powered-By;
    }

    # Kein anderes PHP-Skript ausführen, keine Punktdateien ausliefern
    location ~ \.php$ { return 404; }
    location ~ /\.(?!well-known) { deny all; }
}
