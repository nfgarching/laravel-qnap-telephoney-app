; Produktion: keine Versionsangabe, keine Fehler im Browser
expose_php = Off
display_errors = Off
log_errors = On
memory_limit = 256M
upload_max_filesize = 8M
post_max_size = 8M
date.timezone = Europe/Berlin

opcache.enable = 1
opcache.enable_cli = 0
; Code liegt im Bind-Mount und ändert sich bei Updates → Zeitstempel prüfen
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
